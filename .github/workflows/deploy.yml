name: Deploy to GitHub Pages

# 每次推到 main 就在云端重新构建并发布；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 发布所需的最小权限：读代码、写 Pages、拿 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，避免两次提交互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # build = tsc --noEmit + 一致性校验 + vite build
      # 类型或数据校验不过，这一步就会失败，坏版本不会上线
      - name: 构建
        run: npm run build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
